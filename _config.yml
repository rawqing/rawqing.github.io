# Site settings 配置站点
title: '雨落寒霜的个人博客'
description: ''
keyword: '雨落寒霜, 雨落寒霜的个人博客, 雨落寒霜的博客, AI, AI测试, Agent测试, LLM, 知识库, 大模型, RAG, 测试开发, java, groovy, kotlin, swift, app测试'
url: 'https://rawqing.github.io' # your host

# if you don't need baseurl, you should leave this value blank.
baseurl: ''

# Navigation links
nav:
  home: '/'
  tags: '/tags.html'

# Footer
footer:
  since: 2017

# Author 配置博主信息
author: '雨落寒霜'
nickname: ''
bio: '木叶霜枫飘零去</br>雨落寒江清风还'
avatar: '/assets/img/profile.png'

# Search
search: true

# Night mode
nightMode: true

# Comments 评论功能
comments:
  disqus: false
  disqus_url: 'https://liaokeyu.disqus.com/embed.js'

# Utterances 留言功能（基于 GitHub Issues 的 GitHub App，前端无需任何 secret）
# 使用方法：
# 1. 在仓库安装 Utterances App：https://github.com/apps/utterances
# 2. 安装时授权目标仓库（需开启 Issues，默认开启）
# 3. 把下面 repo 改成 "用户名/仓库名" 格式
# 4. 把 enable 改为 true
utterances:
  enable: true                      # 安装 App 并填好 repo 后改为 true 启用
  repo: 'rawqing/rawqing.github.io'  # 格式必须是 owner/repo
  issue_term: 'pathname'             # 用文章路径映射 Issue（可选 pathname/url/title/og:title）
  theme: 'github-light'              # 可选 github-light / github-dark
  label: 'comment'                  # 给评论 Issue 打的标签（留空则用默认）

# MathJax 公式支持 by Ray-Eldath
mathjax: true

# Share
social-share: true
social-share-items: ['wechat', 'weibo', 'douban', 'twitter']

# theme color 主题皮肤
theme-color: 'default'  # pink or default

# Post header background patterns (when the post no cover): circuitBoard, overlappingCircles, food, glamorous, ticTacToe, seaOfClouds
postPatterns: 'circuitBoard'

# SNS settings 配置社交网站
# url: email, weibo, zhihu, twitter, instagram, juejin, github, douban, facebook, dribble, uicn, jianshu, medium, linkedin
sns:
  weibo: '//weibo.com/1318834417/'
#  juejin: '//juejin.im/user/57a6f434165abd006159b4cc'
#  instagram: '//www.instagram.com/steveliaocn'
  github: '//github.com/rawqing'
  email: 'mailto:kingstar95d@gmail.com'

# Tags 设置标签
recommend-tags: true # whether or not display recommend-tags on the sidebar
recommend-condition-size: 20 # a tag will be recommended if the size of it is more than this value

# Build settings
paginate: 6
paginate_path: 'page:num'
exclude: ['node_modules', 'dev', 'package.json', 'gulpfile.js', '.gitignore', 'README.md', 'vendor', '.bundle', 'Gemfile', 'Gemfile.lock']

# Markdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# 文章目录 TOC（文章页左侧导航）
toc: true

# 访问统计（百度统计）：前往 https://tongji.baidu.com 注册并添加站点，
# 获取「站点ID」（一串纯数字），将下面引号内填上即可生效；留空 '' 则不加载统计脚本
analytics:
  baidu: 'cea8b3e09b48f0ac198cf7a29e3b4f37'

# Permalink
# See: https://github.com/kaeyleo/jekyll-theme-H2O/issues/35
permalink: /:year/:month/:day/:title.html

# Plugins
plugins: [jekyll-paginate, jekyll-sitemap]
